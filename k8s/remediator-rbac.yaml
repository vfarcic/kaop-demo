# Write access for the Kubernetes Remediator, in the dot-agent-deck namespace only.
# The chart's rbac.create adds cluster-wide read (Kubernetes' view role) on top.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-remediator
  namespace: dot-agent-deck
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-remediator
  namespace: dot-agent-deck
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-remediator
subjects:
  - kind: ServiceAccount
    name: kubernetes-remediator-agentops-agent-base
    namespace: kaop
