apiVersion: v1
kind: Namespace
metadata:
  name: dot-agent-deck
---
# The image's own nginx config (site/nginx-default.conf in dot-agent-deck v0.47.1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: website
  namespace: dot-agent-deck
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        root /usr/share/nginx/html;
        index index.html;

        include /etc/nginx/site-redirects.conf;

        location ~ \.md$ {
            types { }
            default_type "text/markdown; charset=utf-8";
        }

        location ~ ^/(llms|llms-full|robots)\.txt$ {
            types { }
            default_type "text/plain; charset=utf-8";
        }

        location = /sitemap.xml {
            types { }
            default_type "application/xml; charset=utf-8";
        }

        location ~ ^/_(redirects|headers)$ {
            return 404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: dot-agent-deck
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: nginx
          image: ghcr.io/vfarcic/komodor-demo:0.47.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: config
          configMap:
            name: website
---
apiVersion: v1
kind: Service
metadata:
  name: website
  namespace: dot-agent-deck
spec:
  selector:
    app: website
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: website
  namespace: dot-agent-deck
spec:
  rules:
    - host: dot-agent-deck.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: visitor
  namespace: dot-agent-deck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: visitor
  template:
    metadata:
      labels:
        app: visitor
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.23.0
          command:
            - sh
            - -c
            - |
              while true; do
                echo "$(date -u +%H:%M:%S) $(curl -s -m 5 -o /dev/null -w '%{http_code}' http://website/)"
                sleep 2
              done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsletter
  namespace: dot-agent-deck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: newsletter
  template:
    metadata:
      labels:
        app: newsletter
    spec:
      containers:
        - name: sender
          image: curlimages/curl:8.23.0
          command:
            - sh
            - -c
            - |
              echo "connecting to smtp relay mail.internal:25"
              curl -s -m 3 telnet://mail.internal:25 || echo "smtp relay unreachable, giving up"
              exit 1
