apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront
  namespace: shop
data:
  default.conf: |
    server {
      listen 80;
      location /healthz {
        return 200 "ok\n";
      }
      location / {
        proxy_connect_timeout 2s;
        proxy_set_header X-Request-ID $request_id;
        proxy_pass http://orders:8080;
      }
    }
