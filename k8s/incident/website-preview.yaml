apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-preview
  namespace: dot-agent-deck
  annotations:
    owner: docs-team
    description: Preview of the redesigned landing page. Not exposed to visitors yet.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
      track: preview
  template:
    metadata:
      labels:
        app: website
        track: preview
    spec:
      containers:
        - name: nginx
          image: hashicorp/http-echo:1.0.0
          args:
            - -listen=:8080
            - -text=preview build
            - -status-code=500
          ports:
            - containerPort: 8080
