# The site is reached at http://dot-agent-deck.127.0.0.1.nip.io: port 80 on this machine goes
# to Traefik in the cluster. kind maps ports only when it creates the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
